<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Decision Engine — Aevura OS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/templatemo-axis-industrial.css">
<link rel="stylesheet" href="css/command-palette.css">
<style>
    :root {
        --accent: #FF3E00;
        --bg: #0a0a0a;
        --surface: #141414;
        --border: #2a2a2a;
        --text: #e0e0e0;
        --text-dim: #999;
        --success: #00ff66;
        --warning: #ffcc00;
        --danger: #ff4444;
    }

    body {
        background-color: var(--bg);
        color: var(--text);
        font-family: 'JetBrains Mono', monospace;
        margin: 0;
        padding: 0;
        line-height: 1.6;
    }

    .app-container {
        max-width: 1200px;
        margin: 0 auto;
        padding: 2rem;
    }

    .header-section {
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        margin-bottom: 3rem;
        gap: 20px;
    }
    .header-section h1 {
        font-family: 'Space Grotesk', sans-serif;
        font-size: 3.5rem;
        font-weight: 700;
        margin: 0;
        letter-spacing: -2px;
        line-height: 0.9;
        text-transform: uppercase;
    }
    .accent-dot { color: var(--accent); }

    .btn-back {
        background: transparent;
        border: 1px solid var(--border);
        color: var(--text-dim);
        padding: 6px 12px;
        font-family: inherit;
        font-size: 9px;
        text-transform: uppercase;
        letter-spacing: 1px;
        cursor: pointer;
        text-decoration: none;
        transition: all 0.15s;
        display: inline-flex;
        align-items: center;
        gap: 4px;
        white-space: nowrap;
        flex-shrink: 0;
        height: fit-content;
    }
    .btn-back:hover { border-color: var(--accent); color: var(--accent); }

    .breadcrumb {
        display: flex;
        align-items: center;
        flex-wrap: nowrap;
        gap: 10px;
        font-size: 11px;
        color: var(--text-dim);
        margin-bottom: 2rem;
        text-transform: uppercase;
        letter-spacing: 1px;
    }
    .breadcrumb span { color: var(--text); }
    @media (max-width: 768px) {
        .breadcrumb { font-size: 8px; gap: 6px; }
        .header-section h1 { font-size: 2.2rem; }
    }

    .engine-grid {
        display: grid;
        grid-template-columns: 1fr 1.5fr;
        gap: 2rem;
        align-items: start;
    }

    @media (max-width: 968px) {
        .engine-grid { grid-template-columns: 1fr; }
    }

    .panel {
        background: var(--surface);
        border: 1px solid var(--border);
        padding: 2rem;
        position: relative;
    }

    .form-group {
        margin-bottom: 1.5rem;
    }
    label {
        display: block;
        font-size: 12px;
        color: var(--text-dim);
        margin-bottom: 0.5rem;
        text-transform: uppercase;
    }
    textarea {
        width: 100%;
        background: #000;
        border: 1px solid var(--border);
        color: #fff;
        padding: 1rem;
        font-family: inherit;
        font-size: 14px;
        resize: vertical;
        box-sizing: border-box;
    }
    textarea:focus {
        border-color: var(--accent);
        outline: none;
    }

    .btn-decide {
        background: var(--accent);
        color: #000;
        border: none;
        padding: 1rem 2rem;
        font-family: inherit;
        font-weight: 700;
        text-transform: uppercase;
        cursor: pointer;
        width: 100%;
        transition: transform 0.1s;
    }
    .btn-decide:hover {
        transform: translate(-2px, -2px);
        box-shadow: 4px 4px 0px #fff;
    }

    .result-panel {
        background: #000;
        border: 1px dashed var(--border);
        min-height: 500px;
        padding: 2.5rem;
    }

    .rec-card {
        background: var(--surface);
        padding: 2rem;
        border-top: 4px solid var(--accent);
        margin-bottom: 2rem;
        position: relative;
    }
    .rec-card h3 {
        margin: 0 0 0.5rem 0;
        font-size: 12px;
        color: var(--accent);
        text-transform: uppercase;
        letter-spacing: 2px;
    }
    .rec-value {
        font-family: 'Space Grotesk', sans-serif;
        font-size: 2rem;
        font-weight: 700;
        line-height: 1.2;
    }

    .section-title {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 2px;
        color: var(--text-dim);
        margin: 2rem 0 1rem 0;
        display: flex;
        align-items: center;
        gap: 10px;
    }
    .section-title::after {
        content: "";
        flex: 1;
        height: 1px;
        background: var(--border);
    }

    .content-text {
        font-size: 14px;
        line-height: 1.7;
        color: #ccc;
        white-space: pre-wrap;
    }

    .options-list {
        display: flex;
        gap: 1rem;
        margin-bottom: 2rem;
        flex-wrap: wrap;
    }
    .option-tag {
        background: #1a1a1a;
        border: 1px solid var(--border);
        padding: 6px 12px;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 1px;
    }

    .loading-overlay {
        display: none;
        flex-direction: column;
        align-items: center;
        gap: 1rem;
        justify-content: center;
        height: 100%;
    }
    .spinner {
        width: 40px;
        height: 40px;
        border: 4px solid #222;
        border-top-color: var(--accent);
        border-radius: 50%;
        animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Custom Scrollbar */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: var(--surface); border-left: 1px solid var(--border); }
    ::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 0; border: 1px solid var(--surface); }
    * { scrollbar-width: thin; scrollbar-color: var(--accent) var(--surface); }

</style>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
</head>
<body>

<div class="app-container">
    <div class="breadcrumb">
        SYSTEM / <span>MODULE 07</span> / <span>DECISION ENGINE</span>
    </div>

    <div class="header-section">
        <h1>Career<br>Decisions<span class="accent-dot">.</span></h1>
        <a href="#" onclick="history.back(); return false;" class="btn-back">← Back</a>
    </div>

    <div class="engine-grid">
        <div class="panel">
            <div class="form-group">
                <label>The Decision Context</label>
                <textarea id="decisionInput" rows="12" placeholder="Should I focus on learning React or Node.js first given my goal of becoming a freelancer?"></textarea>
            </div>
            <button class="btn-decide" id="decideBtn" onclick="runDecision()">
                Run Analysis Engine
            </button>
        </div>

        <div class="result-panel" id="resultArea">
            <div id="placeholder" style="text-align:center; margin-top: 150px; color: #333;">
                // AWAITING VARIABLES<br>
                Provide decision context for career-path optimization.
            </div>

            <div class="loading-overlay" id="loading">
                <div class="spinner"></div>
                <div style="font-size: 11px; letter-spacing: 2px;">WEIGHING OPTIONS...</div>
            </div>

            <div id="decisionResult" style="display:none;">
                <!-- Filled via JS -->
            </div>
        </div>
    </div>
</div>

<script>
async function runDecision() {
    const question = document.getElementById('decisionInput').value;
    const btn = document.getElementById('decideBtn');
    const placeholder = document.getElementById('placeholder');
    const loading = document.getElementById('loading');
    const resultDiv = document.getElementById('decisionResult');

    if (!question.trim()) return alert("Please provide a question or context for the decision.");

    btn.disabled = true;
    placeholder.style.display = 'none';
    loading.style.display = 'flex';
    resultDiv.style.display = 'none';

    try {
        const response = await fetch('/api/decision-engine/decide', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ question })
        });
        
        const data = await response.json();
        if (!response.ok || data.error) throw new Error(data.error || `Server Error: ${response.status}`);

        renderResult(data);
    } catch (err) {
        alert("System Error: " + err.message);
        placeholder.style.display = 'block';
    } finally {
        btn.disabled = false;
        loading.style.display = 'none';
    }
}

function renderResult(data) {
    const resultDiv = document.getElementById('decisionResult');
    
    resultDiv.innerHTML = `
        <div class="rec-card">
            <h3>RECOMMENDED ACTION</h3>
            <div class="rec-value">${data.recommendation}</div>
        </div>

        <div class="section-title">Identified Options</div>
        <div class="options-list">
            ${data.options.map(opt => `<span class="option-tag">${opt}</span>`).join('')}
        </div>

        <div class="section-title">Strategic Comparison</div>
        <div class="content-text">${data.comparison}</div>

        <div class="section-title">Profile-Aligned Reasoning</div>
        <div class="content-text">${data.reasoning}</div>
    `;
    
    resultDiv.style.display = 'block';
}

// OS UI Handled via script
</script>

<script src="js/command-palette.js"></script>
<script src="js/os-ui.js"></script>
</body>
</html>
