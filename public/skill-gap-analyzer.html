<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Skill Gap Analyzer — Aevura OS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/templatemo-axis-industrial.css">
<link rel="stylesheet" href="css/command-palette.css">
<style>
    :root {
        --accent: #FF3E00;
        --bg: #0a0a0a;
        --surface: #141414;
        --border: #2a2a2a;
        --text: #e0e0e0;
        --text-dim: #999;
        --success: #00ff66;
        --warning: #ffcc00;
        --danger: #ff4444;
    }

    body {
        background-color: var(--bg);
        color: var(--text);
        font-family: 'JetBrains Mono', monospace;
        margin: 0;
        padding: 0;
        line-height: 1.6;
    }

    .app-container {
        max-width: 1200px;
        margin: 0 auto;
        padding: 2rem;
    }

    .header-section {
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        margin-bottom: 3rem;
        gap: 20px;
    }
    .header-section h1 {
        font-family: 'Space Grotesk', sans-serif;
        font-size: 3.5rem;
        font-weight: 700;
        margin: 0;
        letter-spacing: -2px;
        line-height: 0.9;
        text-transform: uppercase;
    }
    .accent-dot { color: var(--accent); }

    .btn-back {
        background: transparent;
        border: 1px solid var(--border);
        color: var(--text-dim);
        padding: 6px 12px;
        font-family: inherit;
        font-size: 9px;
        text-transform: uppercase;
        letter-spacing: 1px;
        cursor: pointer;
        text-decoration: none;
        transition: all 0.15s;
        display: inline-flex;
        align-items: center;
        gap: 4px;
        white-space: nowrap;
        flex-shrink: 0;
        height: fit-content;
    }
    .btn-back:hover { border-color: var(--accent); color: var(--accent); }

    .breadcrumb {
        display: flex;
        align-items: center;
        flex-wrap: nowrap;
        gap: 10px;
        font-size: 11px;
        color: var(--text-dim);
        margin-bottom: 2rem;
        text-transform: uppercase;
        letter-spacing: 1px;
    }
    .breadcrumb span { color: var(--text); }
    @media (max-width: 768px) {
        .breadcrumb { font-size: 8px; gap: 6px; }
        .header-section h1 { font-size: 2.2rem; }
    }

    .analyzer-grid {
        display: grid;
        grid-template-columns: 1fr 1.5fr;
        gap: 2rem;
        align-items: start;
    }

    @media (max-width: 968px) {
        .analyzer-grid { grid-template-columns: 1fr; }
    }

    .panel {
        background: var(--surface);
        border: 1px solid var(--border);
        padding: 2rem;
        position: relative;
    }

    .form-group {
        margin-bottom: 1.5rem;
    }
    label {
        display: block;
        font-size: 12px;
        color: var(--text-dim);
        margin-bottom: 0.5rem;
        text-transform: uppercase;
    }
    textarea {
        width: 100%;
        background: #000;
        border: 1px solid var(--border);
        color: #fff;
        padding: 1rem;
        font-family: inherit;
        font-size: 14px;
        resize: vertical;
        box-sizing: border-box;
    }
    textarea:focus {
        border-color: var(--accent);
        outline: none;
    }

    .btn-scan {
        background: var(--accent);
        color: #000;
        border: none;
        padding: 1rem 2rem;
        font-family: inherit;
        font-weight: 700;
        text-transform: uppercase;
        cursor: pointer;
        width: 100%;
        transition: transform 0.1s;
    }
    .btn-scan:hover {
        transform: translate(-2px, -2px);
        box-shadow: 4px 4px 0px #fff;
    }

    .result-panel {
        background: #000;
        border: 1px dashed var(--border);
        min-height: 500px;
        padding: 2.5rem;
    }

    .score-container {
        display: flex;
        align-items: center;
        gap: 2rem;
        margin-bottom: 3rem;
    }
    .score-circle {
        width: 120px;
        height: 120px;
        border: 8px solid var(--border);
        border-radius: 50%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        position: relative;
    }
    .score-num {
        font-size: 2.5rem;
        font-family: 'Space Grotesk', sans-serif;
        font-weight: 700;
        line-height: 1;
    }
    .score-label {
        font-size: 10px;
        text-transform: uppercase;
        color: var(--text-dim);
    }

    .analysis-card {
        background: var(--surface);
        padding: 1.5rem;
        border-left: 4px solid var(--accent);
        margin-bottom: 2rem;
    }
    .analysis-card h3 {
        margin: 0 0 1rem 0;
        font-size: 14px;
        text-transform: uppercase;
        letter-spacing: 1px;
    }
    .analysis-text {
        font-size: 14px;
        color: #ccc;
        font-style: italic;
    }

    .gap-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 1.5rem;
        margin-bottom: 2rem;
    }
    .gap-box {
        border: 1px solid var(--border);
        padding: 1.5rem;
    }
    .gap-box h4 {
        margin: 0 0 1rem 0;
        font-size: 12px;
        color: var(--text-dim);
        text-transform: uppercase;
    }
    .tag-list {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
    }
    .gap-tag {
        background: rgba(255, 68, 68, 0.1);
        color: var(--danger);
        border: 1px solid var(--danger);
        padding: 4px 8px;
        font-size: 11px;
        text-transform: uppercase;
    }

    .action-plan {
        margin-top: 2rem;
    }
    .action-plan h3 {
        font-family: 'Space Grotesk', sans-serif;
        font-size: 1.5rem;
        margin-bottom: 1.5rem;
        border-bottom: 1px solid var(--border);
        padding-bottom: 0.5rem;
    }
    .task-item {
        background: #0f0f0f;
        padding: 1rem;
        margin-bottom: 0.5rem;
        display: flex;
        align-items: center;
        gap: 1rem;
        border: 1px solid var(--border);
    }
    .priority-dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
    }
    .priority-High { background: var(--danger); box-shadow: 0 0 8px var(--danger); }
    .priority-Medium { background: var(--warning); }
    .priority-Low { background: var(--text-dim); }

    .loading-overlay {
        display: none;
        flex-direction: column;
        align-items: center;
        gap: 1rem;
        justify-content: center;
        height: 100%;
    }
    .spinner {
        width: 40px;
        height: 40px;
        border: 4px solid #222;
        border-top-color: var(--accent);
        border-radius: 50%;
        animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    * { scrollbar-width: thin; }

</style>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
</head>
<body>

<div class="app-container">
    <div class="breadcrumb">
        SYSTEM / <span>MODULE 04</span> / <span>SKILL GAP ANALYZER</span>
    </div>

    <div class="header-section">
        <h1>Identify<br>The Gap<span class="accent-dot">.</span></h1>
        <a href="#" onclick="history.back(); return false;" class="btn-back">← Back</a>
    </div>

    <div class="analyzer-grid">
        <div class="panel">
            <div class="form-group">
                <label>Target Job Description</label>
                <textarea id="jobDescription" rows="15" placeholder="Paste the full job description or requirements here..."></textarea>
            </div>
            <button class="btn-scan" id="scanBtn" onclick="runAnalysis()">
                Scan For Weaknesses
            </button>
        </div>

        <div class="result-panel" id="resultArea">
            <div id="placeholder" style="text-align:center; margin-top: 100px; color: #333;">
                // STANDBY<br>
                Submit job requirements to begin structural comparison.
            </div>

            <div class="loading-overlay" id="loading">
                <div class="spinner"></div>
                <div style="font-size: 11px; letter-spacing: 2px;">SCANNING JOB VECTORS...</div>
            </div>

            <div id="analysisResult" style="display:none;">
                <!-- Filled via JS -->
            </div>
        </div>
    </div>
</div>

<script>
async function runAnalysis() {
    const jd = document.getElementById('jobDescription').value;
    const btn = document.getElementById('scanBtn');
    const placeholder = document.getElementById('placeholder');
    const loading = document.getElementById('loading');
    const resultDiv = document.getElementById('analysisResult');

    if (!jd.trim()) return alert("Please paste a job description.");

    btn.disabled = true;
    placeholder.style.display = 'none';
    loading.style.display = 'flex';
    resultDiv.style.display = 'none';

    try {
        const response = await fetch('/api/skill-gap/analyze', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ jobDescription: jd })
        });
        
        const contentType = response.headers.get("content-type");
        if (!contentType || !contentType.includes("application/json")) {
            const text = await response.text();
            console.error("Non-JSON response received:", text);
            throw new Error(`Server returned non-JSON response (${response.status}). Check server logs.`);
        }

        const data = await response.json();
        if (!response.ok || data.error) throw new Error(data.error || `Server Error: ${response.status}`);

        renderResult(data);
    } catch (err) {
        alert("System Error: " + err.message);
        placeholder.style.display = 'block';
    } finally {
        btn.disabled = false;
        loading.style.display = 'none';
    }
}

function renderResult(data) {
    const resultDiv = document.getElementById('analysisResult');
    
    // Determine color based on score
    let scoreColor = 'var(--danger)';
    if (data.match_score > 70) scoreColor = 'var(--success)';
    else if (data.match_score > 40) scoreColor = 'var(--warning)';

    resultDiv.innerHTML = `
        <div class="score-container">
            <div class="score-circle" style="border-color: ${scoreColor}">
                <span class="score-num" style="color: ${scoreColor}">${data.match_score}%</span>
                <span class="score-label">Match</span>
            </div>
            <div>
                <h2 style="margin:0; font-family: 'Space Grotesk';">Recruiter Analysis</h2>
                <p style="font-size: 13px; color: var(--text-dim); margin: 5px 0 0 0;">Automated comparison against Global Profile</p>
            </div>
        </div>

        <div class="analysis-card">
            <h3>Blunt Feedback</h3>
            <p class="analysis-text">"${data.analysis}"</p>
        </div>

        <div class="gap-grid">
            <div class="gap-box">
                <h4>Missing Skills</h4>
                <div class="tag-list">
                    ${data.missing_skills.map(s => `<span class="gap-tag">${s}</span>`).join('') || '<span style="color:var(--success); font-size:11px;">NONE IDENTIFIED</span>'}
                </div>
            </div>
            <div class="gap-box">
                <h4>Missing Tools</h4>
                <div class="tag-list">
                    ${data.missing_tools.map(t => `<span class="gap-tag">${t}</span>`).join('') || '<span style="color:var(--success); font-size:11px;">NONE IDENTIFIED</span>'}
                </div>
            </div>
        </div>

        <div class="panel" style="margin-bottom: 2rem; border-color: #333;">
            <label>Experience Depth Gap</label>
            <p style="font-size: 14px; margin: 0.5rem 0 0 0;">${data.missing_experience_depth}</p>
        </div>

        <div class="action-plan">
            <h3>Bridge The Gap</h3>
            ${data.action_plan.map(item => `
                <div class="task-item">
                    <div class="priority-dot priority-${item.priority}"></div>
                    <div style="flex:1; font-size: 13px;">${item.task}</div>
                    <div style="font-size: 10px; color: var(--text-dim); text-transform: uppercase;">${item.priority} Priority</div>
                </div>
            `).join('')}
        </div>
    `;
    
    resultDiv.style.display = 'block';
}

// OS UI Handled via script
</script>

<script src="js/command-palette.js"></script>
<script src="js/os-ui.js"></script>
</body>
</html>
