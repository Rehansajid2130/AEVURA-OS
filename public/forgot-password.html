<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password — Aevura OS</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Courier New', monospace;
            background: #0d0d0d;
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .card {
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 40px;
            width: 100%;
            max-width: 440px;
        }
        .logo { color: #ff3e00; font-size: 12px; letter-spacing: 3px; margin-bottom: 8px; }
        h1 { font-size: 24px; margin-bottom: 4px; }
        .subtitle { color: #777; font-size: 13px; margin-bottom: 32px; }
        .field { margin-bottom: 18px; }
        label { display: block; font-size: 12px; color: #aaa; margin-bottom: 6px; letter-spacing: 1px; }
        input {
            width: 100%;
            padding: 10px 12px;
            background: #111;
            border: 1px solid #333;
            border-radius: 4px;
            color: #e0e0e0;
            font-family: inherit;
            font-size: 14px;
        }
        input:focus { outline: none; border-color: #ff3e00; }
        .btn {
            display: block;
            width: 100%;
            padding: 12px;
            background: #ff3e00;
            color: white;
            border: none;
            border-radius: 4px;
            font-family: inherit;
            font-size: 14px;
            letter-spacing: 1px;
            cursor: pointer;
            margin-top: 24px;
        }
        .btn:hover { background: #e03500; }
        .btn:disabled { background: #555; cursor: not-allowed; }
        .error {
            background: #2a1010;
            border: 1px solid #ff3e00;
            color: #ff7a5a;
            padding: 10px 12px;
            border-radius: 4px;
            font-size: 13px;
            margin-top: 16px;
            display: none;
        }
        .success {
            background: #102a10;
            border: 1px solid #3e8f3e;
            color: #7aff7a;
            padding: 10px 12px;
            border-radius: 4px;
            font-size: 13px;
            margin-top: 16px;
            display: none;
        }
        .link-row { text-align: center; margin-top: 24px; font-size: 13px; color: #777; }
        .link-row a { color: #ff3e00; text-decoration: none; }
        .link-row a:hover { text-decoration: underline; }
        .divider { border: none; border-top: 1px solid #222; margin: 28px 0; }
        .password-container { position: relative; }
        .toggle-password {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #555;
            cursor: pointer;
            font-family: inherit;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: color 0.2s;
        }
        .toggle-password:hover { color: #ff3e00; }

        
        .reset-form { display: none; }
        .reset-form.visible { display: block; }
        .verify-form { display: block; }
        .verify-form.hidden { display: none; }
    </style>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
</head>
<body>
    <div class="card">
        <div class="logo">// AEVURA <span style="font-size: 0.85em;">OS</span></div>
        <h1>Identity Verification</h1>
        <p class="subtitle">Enter your email to verify your account.</p>
        <hr class="divider">

        <div class="verify-form" id="verifyForm">
            <div class="field">
                <label for="email">EMAIL</label>
                <input type="email" id="email" placeholder="you@example.com">
            </div>
            <button class="btn" id="verifyBtn" onclick="handleVerify()">VERIFY ACCOUNT →</button>
        </div>

        <div class="reset-form" id="resetForm">
            <div class="field">
                <label for="newPassword">NEW PASSWORD</label>
                <div class="password-container">
                    <input type="password" id="newPassword" placeholder="Min 6 characters">
                    <button type="button" class="toggle-password" onclick="toggleVisibility('newPassword', this)">Show</button>
                </div>
            </div>
            <div class="field">
                <label for="confirmPassword">CONFIRM PASSWORD</label>
                <div class="password-container">
                    <input type="password" id="confirmPassword" placeholder="••••••••">
                    <button type="button" class="toggle-password" onclick="toggleVisibility('confirmPassword', this)">Show</button>
                </div>
            </div>
            <button class="btn" id="resetBtn" onclick="handleReset()">RESET PASSWORD →</button>
        </div>

        <div class="error" id="errorBox"></div>
        <div class="success" id="successBox"></div>

        <div class="link-row">
            Remembered your password? <a href="signin">Sign in here</a>
        </div>
    </div>

    <script>
        let verifiedEmail = "";

        function toggleVisibility(id, btn) {
            const input = document.getElementById(id);
            const type = input.getAttribute('type') === 'password' ? 'text' : 'password';
            input.setAttribute('type', type);
            btn.textContent = type === 'password' ? 'Show' : 'Hide';
        }

        async function handleVerify() {
            const email = document.getElementById('email').value.trim();
            const btn = document.getElementById('verifyBtn');
            const errorBox = document.getElementById('errorBox');
            const successBox = document.getElementById('successBox');

            errorBox.style.display = 'none';
            successBox.style.display = 'none';

            if (!email) {
                errorBox.textContent = 'Please enter your email address.';
                errorBox.style.display = 'block';
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Verifying...';

            try {
                const res = await fetch('/api/forgot-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });
                const data = await res.json();

                if (data.error) {
                    errorBox.textContent = data.error;
                    errorBox.style.display = 'block';
                    btn.disabled = false;
                    btn.textContent = 'VERIFY ACCOUNT →';
                    return;
                }

                verifiedEmail = email;
                successBox.textContent = data.message;
                successBox.style.display = 'block';
                
                // Hide verify form and show reset form
                document.getElementById('verifyForm').classList.add('hidden');
                document.getElementById('resetForm').classList.add('visible');
                document.querySelector('h1').textContent = "Reset Password";
                document.querySelector('.subtitle').textContent = "Create a new secure password for your account.";

            } catch (e) {
                errorBox.textContent = 'Could not connect to server. Is it running?';
                errorBox.style.display = 'block';
                btn.disabled = false;
                btn.textContent = 'VERIFY ACCOUNT →';
            }
        }

        async function handleReset() {
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const btn = document.getElementById('resetBtn');
            const errorBox = document.getElementById('errorBox');
            const successBox = document.getElementById('successBox');

            errorBox.style.display = 'none';
            successBox.style.display = 'none';

            if (newPassword.length < 6) {
                errorBox.textContent = 'Password must be at least 6 characters.';
                errorBox.style.display = 'block';
                return;
            }

            if (newPassword !== confirmPassword) {
                errorBox.textContent = 'Passwords do not match.';
                errorBox.style.display = 'block';
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Resetting...';

            try {
                const res = await fetch('/api/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: verifiedEmail, newPassword })
                });
                const data = await res.json();

                if (data.error) {
                    errorBox.textContent = data.error;
                    errorBox.style.display = 'block';
                    btn.disabled = false;
                    btn.textContent = 'RESET PASSWORD →';
                    return;
                }

                successBox.textContent = data.message + ' Redirecting to sign in...';
                successBox.style.display = 'block';
                setTimeout(() => { window.location.href = '/signin'; }, 1500);

            } catch (e) {
                errorBox.textContent = 'Could not connect to server. Is it running?';
                errorBox.style.display = 'block';
                btn.disabled = false;
                btn.textContent = 'RESET PASSWORD →';
            }
        }
    </script>
</body>
</html>
